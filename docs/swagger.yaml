securityDefinitions:
  ApiKeyAuth:
    description: Admin API key for machine-to-machine access.
    in: header
    name: X-API-Key
    type: apiKey
  BearerAuth:
    description: JWT token or API key. Use "Bearer {token}" format.
    in: header
    name: Authorization
    type: apiKey
