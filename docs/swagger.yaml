      connected:
        type: boolean
      endpoint:
        type: string
      last_handshake:
        type: string
      public_key:
        type: string
      transfer_rx:
        type: integer
      transfer_tx:
        type: integer
    type: object
  github_com_hayward-solutions_wireguard-ui_internal_domain.ServerConfig:
