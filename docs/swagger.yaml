host: localhost:8080
info:
  contact:
    name: WireGuard UI
  description: REST API for managing WireGuard VPN peers, tunnels, users, groups,
    and ACLs.
  license:
    name: MIT
  title: WireGuard UI API
  version: "1.0"
paths:
  /api/v1/acls:
    get:
      description: Returns all ACL rules.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_hayward-solutions_wireguard-ui_internal_domain.ACLRule'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.Response'
      security:
      - BearerAuth: []
      summary: List ACL rules
      tags:
      - acls
    post:
      consumes:
      - application/json
      description: Creates a new ACL rule.
      parameters:
      - description: ACL rule details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.CreateACLRuleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_hayward-solutions_wireguard-ui_internal_domain.ACLRule'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.Response'
      security:
      - BearerAuth: []
      summary: Create ACL rule
      tags:
      - acls
  /api/v1/acls/{id}:
    delete:
      description: Deletes an ACL rule by ID.
      parameters:
      - description: ACL Rule ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_api.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_api.MessageResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.Response'
      security:
      - BearerAuth: []
      summary: Delete ACL rule
      tags:
      - acls
    get:
      description: Returns a single ACL rule by ID.
      parameters:
      - description: ACL Rule ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hayward-solutions_wireguard-ui_internal_domain.ACLRule'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.Response'
      security:
      - BearerAuth: []
      summary: Get ACL rule
      tags:
      - acls
    put:
      consumes:
      - application/json
      description: Updates an existing ACL rule.
      parameters:
      - description: ACL Rule ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.UpdateACLRuleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hayward-solutions_wireguard-ui_internal_domain.ACLRule'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.Response'
      security:
      - BearerAuth: []
      summary: Update ACL rule
      tags:
      - acls
  /api/v1/acls/effective/{userID}:
    get:
      description: Returns the effective ACL rules for a given user (including group
        memberships).
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_hayward-solutions_wireguard-ui_internal_domain.ACLRule'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.Response'
      security:
      - BearerAuth: []
      summary: Get effective ACL rules
      tags:
      - acls
  /api/v1/acls/reload:
    post:
      description: Forces a reload of the ACL policy engine from the database.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_api.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_api.MessageResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.Response'
      security:
      - BearerAuth: []
      summary: Reload ACL engine
      tags:
      - acls
  /api/v1/groups:
    get:
      description: Returns all groups.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_hayward-solutions_wireguard-ui_internal_domain.Group'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.Response'
      security:
      - BearerAuth: []
      summary: List groups
      tags:
      - groups
    post:
      consumes:
      - application/json
      description: Creates a new group.
      parameters:
      - description: Group details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.CreateGroupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_hayward-solutions_wireguard-ui_internal_domain.Group'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.Response'
      security:
      - BearerAuth: []
      summary: Create group
      tags:
      - groups
  /api/v1/groups/{id}:
    delete:
      description: Deletes a group by ID.
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_api.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_api.MessageResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.Response'
      security:
      - BearerAuth: []
      summary: Delete group
      tags:
      - groups
    get:
      description: Returns a single group by ID.
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hayward-solutions_wireguard-ui_internal_domain.Group'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.Response'
      security:
      - BearerAuth: []
      summary: Get group
      tags:
      - groups
    put:
      consumes:
      - application/json
      description: Updates an existing group.
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.UpdateGroupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hayward-solutions_wireguard-ui_internal_domain.Group'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.Response'
      security:
      - BearerAuth: []
      summary: Update group
      tags:
