      id:
        type: string
      listen_port:
        type: integer
      mtu:
        type: integer
      post_down:
        type: string
      post_up:
        type: string
      public_key:
        type: string
      tunnel_subnet:
        type: string
      updated_at:
        type: string
    type: object
  github_com_hayward-solutions_wireguard-ui_internal_domain.Tunnel:
    properties:
      address:
        description: VPN address for this end, e.g. "10.100.0.1/30"
        type: string
      created_at:
        type: string
      description:
        type: string
      dns:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      listen_port:
        description: 0 = ephemeral (outbound-only)
        type: integer
      mtu:
        type: integer
      name:
        type: string
      peer_allowed_ips:
        description: remote subnets, e.g. "10.1.0.0/24, 10.2.0.0/24"
        type: string
      peer_endpoint:
        description: e.g. "vpn-west.example.com:51820"
        type: string
      peer_public_key:
        description: Remote peer config
        type: string
      persistent_keepalive:
        type: integer
      public_key:
        type: string
      updated_at:
        type: string
    type: object
  github_com_hayward-solutions_wireguard-ui_internal_domain.TunnelStatus:
