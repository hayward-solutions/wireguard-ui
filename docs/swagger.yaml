basePath: /
definitions:
  github_com_hayward-solutions_wireguard-ui_internal_domain.ACLRule:
    properties:
      action:
        description: '"allow" (default-deny model)'
        type: string
      created_at:
        type: string
      description:
        type: string
      dst_cidr:
        description: single CIDR, e.g. "10.0.0.0/24"
        type: string
      dst_ports:
        description: '"" (all), "80", "443", "8000-8999"'
        type: string
      enabled:
        type: boolean
      group_id:
        description: mutually exclusive with UserID
        type: string
      id:
        type: string
      name:
        type: string
      priority:
        description: lower = evaluated first
        type: integer
      protocol:
        description: '"any", "tcp", "udp"'
        type: string
      updated_at:
        type: string
      user_id:
        description: mutually exclusive with GroupID
        type: string
    type: object
  github_com_hayward-solutions_wireguard-ui_internal_domain.FirewallConfig:
    properties:
      allow_peer_to_peer:
        description: when false (default), drops wg→wg traffic to isolate peers
        type: boolean
      enable_forwarding:
        type: boolean
      enable_nat:
        type: boolean
      nat_out_interface:
        description: outbound interface glob; defaults to "eth+"
        type: string
      nat_source:
        description: CIDR for POSTROUTING; defaults to server Address
        type: string
    type: object
  github_com_hayward-solutions_wireguard-ui_internal_domain.Group:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      source:
        description: '"local" or "oidc"'
        type: string
    type: object
  github_com_hayward-solutions_wireguard-ui_internal_domain.Peer:
    properties:
      address:
        type: string
      allowed_ips:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      created_by_name:
        type: string
      dns:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      persistent_keepalive:
        type: integer
      public_key:
        type: string
      updated_at:
        type: string
    type: object
  github_com_hayward-solutions_wireguard-ui_internal_domain.PeerStats:
