services:
  wg-server:
    build:
      context: ../..
    # No cap_add, devices, or sysctls — proving Fargate compatibility.
    environment:
      - WG_NETSTACK_MODE=true
      - WG_USERSPACE_MODE=false
      - WG_ENDPOINT=wg-server:51820
      - WG_ADDRESS=10.0.0.1/24
      - WG_LISTEN_PORT=51820
      - WG_DNS=1.1.1.1
      - WG_DEFAULT_ALLOWED_IPS=10.0.0.0/24
      - DATABASE_DRIVER=sqlite
      - DATABASE_DSN=/data/wireguard.db
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=testpassword
      - ADMIN_API_KEY=test-api-key-12345
      - JWT_SECRET=test-jwt-secret
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/v1/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  wg-client:
    image: alpine:3.21
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    depends_on:
      wg-server:
        condition: service_healthy
    environment:
      - SERVER_URL=http://wg-server:8080
      - API_KEY=test-api-key-12345
      - SERVER_VPN_IP=10.0.0.1
    volumes:
      - ./test.sh:/test.sh:ro
    entrypoint: ["/bin/sh", "/test.sh"]
